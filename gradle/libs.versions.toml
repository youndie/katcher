[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here.
sborka = "0.4.0.111"
# The compiler comes with them: `wip`, the catalog a sborka release publishes, carries kotlin,
# ksp and agp. The AGP version in particular was AHEAD of the shared catalog here (9.4.0 against
# 9.3.2) — the catalog was raised to match rather than this repository moved back.
atomicfu = "0.33.0"
# kore: the process lifecycle of a server binary — the ordered shutdown, the three probes and
# /version. One number for the two libraries and the Gradle plugin that generates the identity;
# they are published together and a plugin from one version with a library from another would
# compile and then disagree about the object it generates.
kore = "0.1.4"
# kore-mcp: the guarded MCP endpoint, under its own number ON PURPOSE. It depends on neither
# kore-core nor kore-ktor, so it can move without them; the rest of kore moving to 0.1.14 is the
# lifecycle migration — `startForKore()` in place of `start()`, the shutdown refusal gated on a
# `DrainGate` rather than on readiness (the predicate form is deprecated there, and warnings are
# errors here) — and that is its own change, not a rider on this one. Fold the two refs back into
# one when that change lands.
koreMcp = "0.1.14"
# youndie/kotlin-native-rt's `iconv` for the Unicode charsets, so the static server needs no gconv
# (#86). linuxX64 only; `server/build.gradle.kts` adds it where it links statically.
kotlinNativeRtIconv = "0.1.0"
kotlinxCoroutinesCore = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"
metrikAgent = "0.3.21"
sqlx4k = "1.13.0"
ktlint = "14.2.0"
okio = "3.18.2"

[libraries]

kore-core = { module = "io.github.youndie:kore-core", version.ref = "kore" }
kore-ktor = { module = "io.github.youndie:kore-ktor", version.ref = "kore" }
# Brings the MCP SDK (`kotlin-sdk-server`) through `api`: the SDK's version is kore-mcp's.
kore-mcp = { module = "io.github.youndie:kore-mcp", version.ref = "koreMcp" }

kotlinNativeRt-iconvUnicode = { module = "io.github.youndie.kotlin-native-rt:iconv-unicode", version.ref = "kotlinNativeRtIconv" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Агент metrik: Ktor-плагин, меряет в процессе и раз в минуту шлёт одну UDP-датаграмму.
metrik-agent = { module = "io.github.youndie.metrik:agent", version.ref = "metrikAgent" }

sqlx4k-sqlite = { module = "io.github.smyrgeorge:sqlx4k-sqlite", version.ref = "sqlx4k" }
sqlx4k-codegen = { module = "io.github.smyrgeorge:sqlx4k-codegen", version.ref = "sqlx4k" }

okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

[plugins]
koreBuild = { id = "io.github.youndie.kore.build", version.ref = "kore" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaParity = { id = "io.github.youndie.sborka.parity", version.ref = "sborka" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
ktlintPlugin = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "atomicfu" }
