#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.native.enableKlibsCrossCompilation=true
#Gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# OFF, AND IT HAS TO BE OFF NOW THAT `shared` HAS A `wasmJs` TARGET.
#
# The Kotlin plugin says so itself at configuration time: "Kotlin targets do not support
# Configuration on Demand ... This may lead to unpredictable and inconsistent behaviour during a
# Gradle build. Unsupported targets: [wasmJs]" (KT-52074). A warning rather than a failure, which is
# the worse shape of the two for a library that gets published.
#
# Little is given up: `org.gradle.configuration-cache` below covers the same ground and more — a
# cached task graph skips configuration entirely rather than narrowing it.
# org.gradle.configureondemand=true

# REQUIRED BY THAT SAME `wasmJs` TARGET, and it does not announce itself as such.
#
# A module with a `js` or `wasmJs` target does not declare a repository — the KOTLIN PLUGIN does, on
# the project: an ivy repository for the Node distribution, and another for binaryen. The default
# FAIL_ON_PROJECT_REPOS refuses the build over a repository nobody here wrote ("added by unknown
# code"), and PREFER_SETTINGS ignores them, which arrives as `Could not find org.nodejs:node` — a
# missing artefact rather than an overridden repository.
#
# What PREFER_PROJECT gives up is a guard against a module declaring its own repositories. Same
# trade, same reasons, as in kvadrant-ui and shildik.
sborka.repositoriesMode=PREFER_PROJECT
org.gradle.configuration-cache=true
kotlin.native.ignoreDisabledTargets=true
#AtomicFu
kotlinx.atomicfu.enableJvmIrTransformation=true
# The head of the version, under the name Gradle reads on its own. CI overrides it with -PVERSION;
# `libVersion()` in the root used to compose `0.1.<BUILD_NUMBER>` when it was unset, and this key
# being called VERSION meant the fallback was dead code — `findProperty("VERSION")` always found it.
#
# THE HEAD IS ALSO IN BOTH PUBLISH WORKFLOWS, spelled as `0.7.<run number>`. Three places, one
# number: they move together or a release goes out under a head nobody chose.
version=0.7.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.katcher
sborka.repository=youndie/katcher
sborka.description=A tiny self-hosted crash tracker for Kotlin, built with Kotlin/Native and HTMX.
sborka.inceptionYear=2026

# 25 for both. The client is consumed by applications in this same portfolio, all of which run on 25,
# and the floor has to be said out loud either way — a consumer below it otherwise resolves the
# library, compiles against it and meets UnsupportedClassVersionError at class loading.
sborka.jvmToolchain=25
sborka.jvmFloor=25
