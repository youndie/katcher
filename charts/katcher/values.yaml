registry:
  server: ghcr.io
  org: youndie

hostname: ""

server:
  image: katcher
  version: 0.5.0
  resources:
    requests:
      cpu: "30m"
      memory: "32Mi"
    limits:
      cpu: "1"
      memory: "64Mi"

# Bearer token for the MCP endpoint, which coding agents use to read crashes.
# Empty means the endpoint is not mounted at all — the feature is off, not open.
# Supply it at deploy time (--set mcp.token=...) from a CI secret; never commit a value here.
mcp:
  token: ""

db:
  size: 512Mi
  class: "local-path"
  path: /data
  name: local.db

sourceMaps:
  size: 2Gi
  class: "local-path"
  path: /source-maps

traefik:
  certResolver: cloudflare
  authMiddleware:
    name: ""
    namespace: ""
  middlewares: []
