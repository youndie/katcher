registry:
  server: ghcr.io
  org: youndie

hostname: ""

server:
  image: katcher
  version: 0.6.2
  resources:
    requests:
      cpu: "30m"
      memory: "32Mi"
    limits:
      cpu: "1"
      # 64Mi held at rest with room to spare, but it left nothing for a burst of concurrent
      # queries — and an allocation that fails inside the native driver is not an exception
      # this process survives. Raised while the crash under fast navigation is unexplained.
      memory: "192Mi"

# Bearer token for the MCP endpoint, which coding agents use to read crashes.
# Empty means the endpoint is not mounted at all — the feature is off, not open.
# Supply it at deploy time (--set mcp.token=...) from a CI secret; never commit a value here.
mcp:
  token: ""

# Monitoring by metrik. Empty endpoint means the agent is not installed at all: nothing is
# measured and nothing is sent. katcher has to come up without metrik — a service that depends
# on its observer is exactly the coupling an observer must not create.
#
# The agent costs the request path ~106ns and sends one UDP packet per minute, so leaving it on
# is cheap; it is optional because not every installation runs a metrik.
metrik:
  # host:port of the metrik ingest service, e.g. metrik-metrik-ingest.metrik.svc:9999
  endpoint: ""
  # Ingest key of the metrik installation — one per installation, not per service.
  # Supply it at deploy time (--set metrik.key=...); it travels through a Secret, not the pod spec.
  key: ""
  existingSecret: ""
  secretKey: ingest-key
  # Name katcher reports under.
  service: katcher
  # The release that draws deploy markers on the charts. Empty means the image version is
  # used, which is what a deploy actually changes.
  release: ""

db:
  size: 512Mi
  class: "local-path"
  path: /data
  name: local.db

  # A copy of the database is taken before every upgrade, by a pre-upgrade hook mounting the
  # same volume. Migrations run forwards only, so without it a bad release has nothing to be
  # rolled back to. Turn it off only where the data is disposable.
  backupBeforeUpgrade: true

  # Any image with a shell will do; the server image is distroless and has none. Pinned by
  # digest-free tag on purpose — this runs once per upgrade and pulling a moving busybox is a
  # smaller risk than an unpatched pinned one.
  backupImage: "busybox:1.37"

sourceMaps:
  size: 2Gi
  class: "local-path"
  path: /source-maps

# **Sign-in, bundled.** Off by default, and that is the important half: Katcher trusts headers set
# by whatever runs in front of it, and an installation that already has an SSO (the `traefik`
# section below) must not acquire a second identity provider by upgrading.
#
# Switched on, three things appear: the shildik chart as a subchart (an OpenID Connect provider
# keeping its state in a SQLite file, like Katcher), an oauth2-proxy in front of Katcher, and a Job
# that creates the realm, the client and the first person to sign in as.
#
# It needs a hostname of its own for the provider — an OIDC provider serves its paths at the root
# of a host, and sharing Katcher's would collide. And it needs one Secret, created before
# installing, because none of these values may be secrets:
#
#     kubectl create secret generic katcher-auth \
#       --from-literal=masterKeys="$(openssl rand -base64 32)" \
#       --from-literal=bootstrapToken="$(openssl rand -hex 16)" \
#       --from-literal=clientSecret="$(openssl rand -hex 24)" \
#       --from-literal=cookieSecret="$(openssl rand -base64 24 | head -c 32)" \
#       --from-literal=initialPassword='<at least 12 characters>'
auth:
  secretName: katcher-auth
  # The person who can sign in on the first day. They are created once; changing this later adds
  # another, it does not rename anyone.
  initialUserEmail: ""
  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: "1"
        memory: 128Mi
  bootstrapImage: curlimages/curl:8.11.1

# Values of the shildik subchart, and the switch that brings it in at all. `enabled: false` means
# the provider is not installed — not installed and turned off, absent.
shildik:
  enabled: false
  # The address the provider answers on, from the browser's side. It goes into every token as
  # `iss`, and the proxy compares the two.
  issuer: ""
  ingress:
    enabled: true
    host: ""
  # **The same Secret as `auth.secretName`, named again because a subchart reads its own values.**
  # One secret serves the provider, the proxy and the bootstrap Job; two would be two things to
  # rotate. A template guard fails the render if these names ever drift apart.
  secret:
    name: katcher-auth
    masterKeysKey: masterKeys
    bootstrapTokenKey: bootstrapToken

traefik:
  certResolver: cloudflare
  authMiddleware:
    name: ""
    namespace: ""
  middlewares: []
