{{- if .Values.mcp.token }}
# Only rendered when a token is supplied. With no token there is no Secret and no
# MCP_TOKEN in the pod, so the server does not mount the MCP endpoint at all:
# the feature stays off by default rather than open by default.
apiVersion: v1
kind: Secret
metadata:
  name: katcher-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app: katcher-backend
type: Opaque
stringData:
  token: {{ .Values.mcp.token | quote }}
{{- end }}
