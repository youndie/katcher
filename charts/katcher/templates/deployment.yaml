apiVersion: apps/v1
kind: Deployment
metadata:
  name: katcher-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: katcher-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: katcher-backend
  template:
    metadata:
      labels:
        app: katcher-backend
    spec:
      containers:
        - name: katcher-backend
          image: "{{ .Values.registry.server }}/{{ .Values.registry.org }}/{{ .Values.server.image }}:{{ .Values.server.version }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PATH
              value: {{ .Values.db.path }}/{{ .Values.db.name }}
            - name: SOURCE_MAPS_PATH
              value: {{ .Values.sourceMaps.path }}
            {{- if .Values.mcp.token }}
            # Read from the Secret rather than inlined, so the token does not show up
            # in `kubectl get deployment -o yaml` or in Helm release history.
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: katcher-mcp
                  key: token
            # The transport rejects any Host it was not told about, defaulting to
            # localhost, so the public hostname has to be declared or every request
            # is refused.
            - name: MCP_ALLOWED_HOSTS
              value: {{ .Values.hostname | quote }}
            {{- end }}
            {{- if .Values.metrik.endpoint }}
            # Мониторинг ставится только вместе с endpoint'ом: пустое значение означает, что
            # плагин не устанавливается вовсе и ничего никуда не отправляется.
            - name: METRIK_ENDPOINT
              value: {{ .Values.metrik.endpoint | quote }}
            - name: METRIK_SERVICE
              value: {{ .Values.metrik.service | quote }}
            # Release marker: metrik draws a line on the charts at every deploy, and the
            # version of the image being deployed is the honest value for it. Left to be
            # overridden — an installation that names releases differently says so — but not
            # left empty, because "no marker" turns every change into an unexplained step in
            # the graphs.
            - name: METRIK_RELEASE
              value: {{ .Values.metrik.release | default .Values.server.version | quote }}
            {{- if or .Values.metrik.key .Values.metrik.existingSecret }}
            # Ingest-key — через Secret: он один на всю инсталляцию metrik, и попадать в спеку
            # пода ему незачем.
            - name: METRIK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrik.existingSecret | default "katcher-metrik" }}
                  key: {{ .Values.metrik.secretKey }}
            {{- end }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.server.resources.requests.cpu | quote }}
              memory: {{ .Values.server.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.server.resources.limits.cpu | quote }}
              memory: {{ .Values.server.resources.limits.memory | quote }}
          volumeMounts:
            - name: sqlite-data
              mountPath: {{ .Values.db.path }}
            - name: mappings-data
              mountPath: {{ .Values.sourceMaps.path }}
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-pvc
        - name: mappings-data
          persistentVolumeClaim:
            claimName: mappings-pvc
