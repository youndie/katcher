apiVersion: apps/v1
kind: Deployment
metadata:
  name: katcher-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: katcher-backend
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the database is one SQLite file on a ReadWriteOnce volume,
  # and a surge means two processes hold it at once — one of them possibly mid-migration.
  # The cost is a few seconds of downtime on every deploy, which is the correct price.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: katcher-backend
  template:
    metadata:
      labels:
        app: katcher-backend
    spec:
      # THE NUMBER THE SHUTDOWN PLAN IS CHECKED AGAINST. `DEADLINES` in `server/src/commonMain/kotlin/Main.kt`
      # adds up to 21 seconds and declares 30 as the budget it is fitting into; nothing tells a
      # process what its real grace period is, on any platform, so the two are one number written in
      # two places and they move together. Lower this and the process is `SIGKILL`ed mid-drain, with
      # kore's fit check saying nothing, because it was told 30.
      terminationGracePeriodSeconds: 30
      containers:
        - name: katcher-backend
          image: "{{ .Values.registry.server }}/{{ .Values.registry.org }}/{{ .Values.server.image }}:{{ .Values.server.version }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PATH
              value: {{ .Values.db.path }}/{{ .Values.db.name }}
            - name: SOURCE_MAPS_PATH
              value: {{ .Values.sourceMaps.path }}
            {{- if .Values.mcp.token }}
            # Read from the Secret rather than inlined, so the token does not show up
            # in `kubectl get deployment -o yaml` or in Helm release history.
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: katcher-mcp
                  key: token
            # The transport rejects any Host it was not told about, defaulting to
            # localhost, so the public hostname has to be declared or every request
            # is refused.
            - name: MCP_ALLOWED_HOSTS
              value: {{ .Values.hostname | quote }}
            {{- end }}
            {{- if .Values.metrik.endpoint }}
            # Мониторинг ставится только вместе с endpoint'ом: пустое значение означает, что
            # плагин не устанавливается вовсе и ничего никуда не отправляется.
            - name: METRIK_ENDPOINT
              value: {{ .Values.metrik.endpoint | quote }}
            - name: METRIK_SERVICE
              value: {{ .Values.metrik.service | quote }}
            # Release marker: metrik draws a line on the charts at every deploy, and the
            # version of the image being deployed is the honest value for it. Left to be
            # overridden — an installation that names releases differently says so — but not
            # left empty, because "no marker" turns every change into an unexplained step in
            # the graphs.
            - name: METRIK_RELEASE
              value: {{ .Values.metrik.release | default .Values.server.version | quote }}
            {{- if or .Values.metrik.key .Values.metrik.existingSecret }}
            # Ingest-key — через Secret: он один на всю инсталляцию metrik, и попадать в спеку
            # пода ему незачем.
            - name: METRIK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrik.existingSecret | default "katcher-metrik" }}
                  key: {{ .Values.metrik.secretKey }}
            {{- end }}
            {{- end }}
          # THE THREE PROBES ANSWER THREE DIFFERENT QUESTIONS, and until this chart had them it
          # asked none: a wedged process kept receiving traffic and a starting one received it
          # too early. One route answering 200 because the process is alive — which is what
          # `/health` is here, and why readiness does not point at it — would have been the other
          # half of the same mistake.
          #
          # `failureThreshold: 60` with `periodSeconds: 1` rather than a long `initialDelaySeconds`:
          # the pod goes into service as soon as it is ready instead of at a fixed time chosen for
          # the worst case. Migrations run before the server serves, so the minute is for them.
          #
          # Readiness is the one that is MEANT to fail. It reads a `SELECT 1` against SQLite and it
          # goes false first thing in the shutdown sequence, which is what stops traffic arriving
          # before anything is closed.
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.server.resources.requests.cpu | quote }}
              memory: {{ .Values.server.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.server.resources.limits.cpu | quote }}
              memory: {{ .Values.server.resources.limits.memory | quote }}
          volumeMounts:
            - name: sqlite-data
              mountPath: {{ .Values.db.path }}
            - name: mappings-data
              mountPath: {{ .Values.sourceMaps.path }}
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-pvc
        - name: mappings-data
          persistentVolumeClaim:
            claimName: mappings-pvc
