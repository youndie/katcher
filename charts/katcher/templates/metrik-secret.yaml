{{- if and .Values.metrik.key (not .Values.metrik.existingSecret) }}
# Секрет появляется только вместе с собственным ключом: если ключ берётся из чужого Secret
# (metrik.existingSecret), второй экземпляр здесь был бы копией, которая протухнет молча.
apiVersion: v1
kind: Secret
metadata:
  name: katcher-metrik
type: Opaque
stringData:
  {{ .Values.metrik.secretKey }}: {{ .Values.metrik.key | quote }}
{{- end }}
