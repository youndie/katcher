apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: katcher-reports-bypass
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.hostname }}`) && Path(`/api/reports`) && Method(`POST`)
      kind: Rule
      services:
        - name: katcher-backend
          port: 8080
      priority: 200
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: katcher-mappings-bypass
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.hostname }}`) && Path(`/api/mappings/upload`) && Method(`POST`)
      kind: Rule
      services:
        - name: katcher-backend
          port: 8080
      priority: 200
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
{{- if .Values.mcp.token }}
---
# MCP clients are machines: they hold no browser session, so the forward-auth
# middleware would reject them before Katcher ever saw the request. This route
# bypasses it for /mcp only, exactly as the ingest routes above do, and the
# endpoint authenticates itself with the bearer token instead.
#
# Rendered only when a token is configured, so the bypass cannot exist without
# the authentication that replaces it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: katcher-mcp-bypass
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.hostname }}`) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - name: katcher-backend
          port: 8080
      priority: 200
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: katcher-main
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.hostname }}`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: katcher-backend
          port: 8080
      priority: 1
    - match: Host(`{{ .Values.hostname }}`)
      kind: Rule
      middlewares:
        - name: {{ .Values.traefik.authMiddleware.name }}
      {{- range .Values.traefik.middlewares }}
        - name: {{ .name }}
      {{- end }}
      services:
        - name: katcher-backend
          port: 8080
      priority: 10
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
