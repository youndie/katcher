name: Publish client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - client/**
      # shared едет вместе с client: client зависит от него api-зависимостью, и потребитель
      # с новыми таргетами клиента упрётся в старый shared, у которого их нет.
      - shared/**
      - .github/workflows/publish-client.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"
      - name: Publish
        run: |
          ./gradlew :shared:publishAllPublicationsToWipRepository :client:publishAllPublicationsToWipRepository --no-daemon
        env:
          # The version head is `version` in gradle.properties; CI appends the run number.
          ORG_GRADLE_PROJECT_VERSION: 0.6.${{ github.run_number }}
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
