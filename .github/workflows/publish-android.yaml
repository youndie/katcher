name: Publish android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"
      - name: Publish
        run: |
          ./gradlew :dev:client-android:publishAndroidPublicationToWipRepository :dev:android-gradle-plugin:publishAllPublicationsToWipRepository --no-daemon
        env:
          # The version head is `version` in gradle.properties; CI appends the run number.
          ORG_GRADLE_PROJECT_VERSION: 0.6.${{ github.run_number }}
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
