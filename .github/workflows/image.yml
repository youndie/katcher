name: Image

# CI builds and tests the code; until this job, nothing ever ran the thing that gets deployed. The
# runtime image is distroless — no shell, no `ls`, nothing to `kubectl exec` into — so what it does
# or does not contain cannot be asked; it can only be exercised. Two changes in the last month were
# about exactly that (#52, the library the binary never calls), and both were checked by hand.
#
# It runs the application far enough to RENDER A DATE rather than far enough to answer a status
# code. Every page that formats a timestamp sits behind authentication, so a smoke test that stops
# at `/` meets the `401` and reports success about a server it never entered. That distinction is
# not hypothetical: it is what a `scratch` base image passed and what it failed (#55).
#
# Path-filtered because it costs about ten minutes, and a change to the client cannot affect it.

# The two lists are the same list, written twice: GitHub's workflow parser does not resolve YAML
# anchors, and one that silently expands to nothing would turn the filter into "never run".
on:
  pull_request:
    paths:
      - server/**
      - core/**
      - shared/**
      - dev/retrace/**
      - dev/image-smoke.sh
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .dockerignore
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - server/**
      - core/**
      - shared/**
      - dev/retrace/**
      - dev/image-smoke.sh
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .dockerignore
      - .github/workflows/image.yml

  # INSTRUMENTATION, AND IT HAS TO BE ASKED FOR — see the same block in ci.yml. RQ0 could bound
  # this job's docker steps exactly and could NOT split the Gradle step inside them: BuildKit's
  # `#11 <seconds>` prefixes are when it flushed a batch, not when a line was written, and
  # `compileKotlinNative` came out at exactly 30.0s in three separate runs because of it.
  #
  # A profile run builds `--target build` and stops there. It does not produce the runtime image
  # and does not run the smoke test, so it is a measurement and never a gate; the ordinary path
  # below is untouched. Doing both would mean two full uncached builds — about fourteen minutes —
  # to answer a question that only needs the first.
  workflow_dispatch:
    inputs:
      profile:
        description: Build with --profile and keep the report instead of building the image
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the runtime image
        if: ${{ !inputs.profile }}
        run: docker build --file server/Dockerfile --tag katcher:ci .

      # The build stage only, with the profiler on, and the report lifted out of it. `docker cp`
      # from a container made off the stage rather than `--output`, because the report has to come
      # from the same filesystem the build wrote it to and nothing else in the stage is wanted.
      - name: Profile the build instead
        if: ${{ inputs.profile }}
        run: |
          docker build --file server/Dockerfile --target build \
            --build-arg GRADLE_PROFILE=--profile --tag katcher:profile .
          id=$(docker create katcher:profile)
          docker cp "$id:/app/build/reports/profile" ./gradle-profile
          docker rm "$id"
          ls -la ./gradle-profile

      - name: Keep the report
        if: ${{ inputs.profile }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-profile-image
          path: ./gradle-profile/
          retention-days: 30

      - name: The image runs, and a page renders a timestamp
        if: ${{ !inputs.profile }}
        run: |
          docker run --detach --name katcher-ci --publish 8080:8080 katcher:ci
          ./dev/image-smoke.sh http://localhost:8080

      # The shutdown is the half of the lifecycle nobody watches, and on Kotlin/Native it is the
      # half that runs its steps in the opposite order from the JVM. A transcript with the stages in
      # the specified order is what says the sequence ran at all — without it, a process that was
      # simply killed at the end of the grace period looks identical from the outside.
      - name: It stops in order, and says so
        if: ${{ !inputs.profile }}
        run: |
          docker stop --timeout 40 katcher-ci
          log=$(docker logs katcher-ci 2>&1)
          printf '%s\n' "$log" | grep -E 'ANNOUNCE|DRAIN|RELEASE_POOLS|EXIT' || true
          for stage in SIGNAL ANNOUNCE DRAIN RELEASE_CONSUMERS RELEASE_POOLS EXIT; do
            if ! printf '%s\n' "$log" | grep -q "$stage COMPLETED"; then
              echo "the shutdown transcript has no completed $stage stage" >&2
              printf '%s\n' "$log" | tail -40 >&2
              exit 1
            fi
          done

      # The container has no shell, so this is the only account of what went wrong.
      - name: What it said, if it did not
        if: ${{ failure() && !inputs.profile }}
        run: docker logs katcher-ci || true

      # WHAT THIS NUMBER IS DEPENDS ON THE HOST, and the field does not say so. With the classic
      # overlay2 storage driver — what a GitHub runner has — `.Size` is the UNPACKED size on disk;
      # with the containerd snapshotter it is the compressed content, i.e. what a `pull` transfers.
      # The same image measured 27 918 036 here and 9 569 623 on a machine with the snapshotter, so
      # the figures in `server/Dockerfile` (pull bytes) and this line are not comparable and are not
      # meant to be. This one is a trend line for this job: it moves when the image does.
      # A measured setting that nothing asserts is a setting that will be deleted.
      - name: The allocator cap survived the build
        if: ${{ !inputs.profile }}
        run: |
          docker image inspect katcher:ci --format '{{json .Config.Env}}' | grep -q 'MALLOC_ARENA_MAX=2' \
            || { echo "the image lost MALLOC_ARENA_MAX=2" >&2; exit 1; }

      - name: Size
        if: ${{ always() && !inputs.profile }}
        run: docker image inspect katcher:ci --format 'unpacked on this runner {{.Size}} bytes (not pull bytes, see the workflow comment)'
