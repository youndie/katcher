name: Image

# CI builds and tests the code; until this job, nothing ever ran the thing that gets deployed. The
# runtime image is distroless — no shell, no `ls`, nothing to `kubectl exec` into — so what it does
# or does not contain cannot be asked; it can only be exercised. Two changes in the last month were
# about exactly that (#52, the library the binary never calls), and both were checked by hand.
#
# It runs the application far enough to RENDER A DATE rather than far enough to answer a status
# code. Every page that formats a timestamp sits behind authentication, so a smoke test that stops
# at `/` meets the `401` and reports success about a server it never entered. That distinction is
# not hypothetical: it is what a `scratch` base image passed and what it failed (#55).
#
# Path-filtered because it costs about ten minutes, and a change to the client cannot affect it.

# The two lists are the same list, written twice: GitHub's workflow parser does not resolve YAML
# anchors, and one that silently expands to nothing would turn the filter into "never run".
on:
  pull_request:
    paths:
      - server/**
      - core/**
      - shared/**
      - dev/retrace/**
      - dev/image-smoke.sh
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .dockerignore
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - server/**
      - core/**
      - shared/**
      - dev/retrace/**
      - dev/image-smoke.sh
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .dockerignore
      - .github/workflows/image.yml

  # INSTRUMENTATION, AND IT HAS TO BE ASKED FOR — see the same block in ci.yml. RQ0 could bound
  # this job's docker steps exactly and could NOT split the Gradle step inside them: BuildKit's
  # `#11 <seconds>` prefixes are when it flushed a batch, not when a line was written, and
  # `compileKotlinNative` came out at exactly 30.0s in three separate runs because of it.
  #
  # Since RQ4 moved Gradle out of `docker build`, a profile run is no longer a separate path: the
  # flag rides along on the `docker run` that links the binary, the image is still assembled, and
  # the smoke test still runs. It costs one extra artifact rather than a second whole build.
  workflow_dispatch:
    inputs:
      profile:
        description: Build with --profile and keep the report instead of building the image
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

# THE PATCHED KOTLIN/NATIVE THE IMAGE IS LINKED WITH (#86), from youndie/kotlin-native-rt: its
# `-static` means static, which is half of what lets the runtime image carry no glibc files (the other
# half is `iconv-unicode`, see `server/build.gradle.kts`). Named here and in
# `publish-katcher-native.yaml`, which pushes the image this job tests — not in gradle.properties:
# the distribution exists for linux-x86_64 alone, and a Mac asked for it fails on the download. Its
# Kotlin part has to be the compiler the sborka catalog pins; a Kotlin bump without a matching `-yrt`
# fails the link loudly, and #86 says how to step back to the stock one.
env:
  KOTLIN_NATIVE_RT: 2.4.20-yrt.2

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # RQ4: THE CACHES THE CONTAINER USED TO START WITHOUT. Inside `docker build` they cannot
      # persist — a BuildKit cache mount lives in the builder's own state, `type=gha` exports
      # layers rather than mounts, and the layer under `COPY . .` is invalidated by every commit.
      # Outside it, this is an ordinary actions/cache.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: image-gradle-${{ runner.os }}-${{ hashFiles('gradle/*.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: image-gradle-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          # The distribution is in the key because it is not in any file: bumping `KOTLIN_NATIVE_RT`
          # alone would otherwise hit the old entry and download the new compiler on every run.
          key: image-konan-${{ runner.os }}-${{ env.KOTLIN_NATIVE_RT }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: image-konan-${{ runner.os }}-

      # THE IMAGE `server/Dockerfile` NAMES AS ITS FIRST STAGE. It used to matter which glibc build
      # this was: the runtime copied the shared glibc and gconv out of that stage, and they had to
      # match the `libc.a` linked here. Since #86 the runtime copies no glibc at all, so the pairing
      # is gone — and it had not held anyway: the `apt-get install g++` below upgrades libc6 inside
      # this container (2.39-0ubuntu8.8 to 8.9 on 27 September), while the stage the Dockerfile
      # copied from kept 8.8.
      # THE TWO CACHES MOUNT AT DIFFERENT PATHS, AND THE ASYMMETRY IS MEASURED RATHER THAN GUESSED.
      # Kotlin/Native takes `$HOME/.konan`, and the container runs as root, so /root/.konan is
      # right. Gradle in this image does NOT honour `GRADLE_USER_HOME`: setting it to /root/.gradle
      # and asking the container afterwards produced
      #
      #     GRADLE_USER_HOME=/root/.gradle
      #     0       /root/.gradle
      #     1.3G    /home/gradle/.gradle
      #
      # so the mount follows where it actually writes. Three green runs passed before this was
      # found — the image built, the smoke test passed, and the time even improved, because the
      # konan half of the cache was real. The only complaint was `actions/cache` reporting "Path(s)
      # specified in the action for caching do(es) not exist" in a post step, which is the last
      # place anyone looks. That is why the receipts below print on every run.
      - name: Link the binary, in the builder image
        run: |
          mkdir -p "$HOME/.gradle" "$HOME/.konan"
          docker run --rm \
            --volume "$PWD":/app --workdir /app \
            --volume "$HOME/.gradle":/home/gradle/.gradle \
            --volume "$HOME/.konan":/root/.konan \
            --env GRADLE_PROFILE="${{ inputs.profile && '--profile' || '' }}" \
            --env KOTLIN_NATIVE_RT \
            gradle:9.7.1-jdk25-noble \
            sh -c 'apt-get update -qq && apt-get install -y --no-install-recommends -qq g++ >/dev/null \
                   && gradle :server:linkReleaseExecutableNative --no-daemon --stacktrace -Pkotlin.native.version=$KOTLIN_NATIVE_RT $GRADLE_PROFILE \
                   && echo "--- inside the container ---" \
                   && echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" \
                   && du -sh /root/.gradle /home/gradle/.gradle 2>/dev/null \
                   && gradle --version | grep -iE "gradle user home|^Gradle" || true'
          # The container writes as root through the mounts; the cache save step and everything
          # after it run as the runner's user.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.gradle" "$HOME/.konan" server/build
          ls -l server/build/bin/native/releaseExecutable/server.kexe

          # WHERE THE CACHES ACTUALLY LANDED. Printed every run, not added while debugging: the
          # first two runs of this change both reported "Path(s) specified in the action for
          # caching do(es) not exist" in the post step, and neither the timings nor the green tick
          # said anything was wrong. A cache the build never writes to still looks like a success.
          echo "--- receipts ---"
          du -sh "$HOME/.gradle" "$HOME/.konan" 2>/dev/null || true
          ls -la "$HOME/.gradle" 2>/dev/null | head -10 || echo "no $HOME/.gradle at all"
          docker run --rm --env GRADLE_USER_HOME=/root/.gradle gradle:9.7.1-jdk25-noble \
            sh -c 'id; echo "HOME=$HOME GRADLE_USER_HOME=$GRADLE_USER_HOME"' || true

      - name: Keep the profile report
        if: ${{ inputs.profile }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-profile-image
          path: build/reports/profile/
          retention-days: 30

      - name: Assemble the runtime image
        run: docker build --file server/Dockerfile --tag katcher:ci .

      - name: The image runs, and a page renders a timestamp
        run: |
          docker run --detach --name katcher-ci --publish 8080:8080 katcher:ci
          ./dev/image-smoke.sh http://localhost:8080

      # The shutdown is the half of the lifecycle nobody watches, and on Kotlin/Native it is the
      # half that runs its steps in the opposite order from the JVM. A transcript with the stages in
      # the specified order is what says the sequence ran at all — without it, a process that was
      # simply killed at the end of the grace period looks identical from the outside.
      #
      # And it has to leave BY ITSELF. `docker stop` sends SIGKILL at the end of its timeout, and a
      # process killed there leaves no EXIT line — but the exit code says so too (137), and the time
      # says how close it came. The whole transcript is printed, every stage, so the log of a green
      # run is the evidence rather than a summary of it.
      - name: It stops in order, and says so
        run: |
          started=$(date +%s)
          docker stop --timeout 40 katcher-ci
          took=$(( $(date +%s) - started ))
          code=$(docker inspect katcher-ci --format '{{.State.ExitCode}}')
          log=$(docker logs katcher-ci 2>&1)
          echo "--- the shutdown: exit code $code after ${took}s of a 40s timeout ---"
          printf '%s\n' "$log" | grep -E 'SIGNAL|ANNOUNCE|DRAIN|RELEASE_|EXIT|participant' || true
          for stage in SIGNAL ANNOUNCE DRAIN RELEASE_CONSUMERS RELEASE_POOLS RELEASE_TELEMETRY EXIT; do
            if ! printf '%s\n' "$log" | grep -q "$stage COMPLETED"; then
              echo "the shutdown transcript has no completed $stage stage" >&2
              printf '%s\n' "$log" | tail -40 >&2
              exit 1
            fi
          done
          if [ "$code" = 137 ] || [ "$took" -ge 40 ]; then
            echo "the process did not leave by itself: exit code $code after ${took}s" >&2
            exit 1
          fi

      # The container has no shell, so this is the only account of what went wrong.
      - name: What it said, if it did not
        if: failure()
        run: docker logs katcher-ci || true

      # WHAT THIS NUMBER IS DEPENDS ON THE HOST, and the field does not say so. With the classic
      # overlay2 storage driver — what a GitHub runner has — `.Size` is the UNPACKED size on disk;
      # with the containerd snapshotter it is the compressed content, i.e. what a `pull` transfers.
      # The same image measured 27 918 036 here and 9 569 623 on a machine with the snapshotter, so
      # the figures in `server/Dockerfile` (pull bytes) and this line are not comparable and are not
      # meant to be. This one is a trend line for this job: it moves when the image does.
      # A measured setting that nothing asserts is a setting that will be deleted.
      - name: The allocator cap survived the build
        run: |
          docker image inspect katcher:ci --format '{{json .Config.Env}}' | grep -q 'MALLOC_ARENA_MAX=2' \
            || { echo "the image lost MALLOC_ARENA_MAX=2" >&2; exit 1; }

      - name: Size
        if: always()
        run: docker image inspect katcher:ci --format 'unpacked on this runner {{.Size}} bytes (not pull bytes, see the workflow comment)'
