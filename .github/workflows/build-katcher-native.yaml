name: Build server native

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: katcher-linux-x86
            output-path: server/build/bin/native/releaseExecutable/server.kexe

          - os: macos-latest
            artifact: katcher-macos-arm64
            output-path: server/build/bin/native/releaseExecutable/server.kexe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"

      - name: Build
        run: ./gradlew :server:linkReleaseExecutableNative --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output-path }}
