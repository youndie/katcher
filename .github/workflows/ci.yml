name: CI

# The other workflows here publish; none of them check. Until this one existed a pull
# request could be merged without anything ever compiling it — which is also why
# Renovate had no signal to automerge on.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native cache: LLVM and the sysroots weigh hundreds of megabytes and are
      # downloaded once. Without it every run spends minutes on that alone.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/*.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # build covers ktlintCheck (through check) and the tests of every module. server and core
      # pick their native target by host, so on this runner that is linuxX64; client and shared
      # declare every target they publish, and the Apple ones are cross-compiled here as klibs
      # (kotlin.native.enableKlibsCrossCompilation in gradle.properties). Tests still run only
      # for the host target.
      - run: ./gradlew build --stacktrace

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 7
